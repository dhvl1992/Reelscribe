<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Reel Scribe (OLD version, for testing)</title>


<style>

* {
    box-sizing: border-box;
}

html {
    width: 100%;
    overflow-x: hidden;
}

body {
    margin: 0;
    width: 100%;
    overflow-x: hidden;

    font-family:
        Arial,
        sans-serif;

    background: #f5f7fb;
    color: #111;
}


/* =========================================
   MAIN APP
========================================= */

.app {

    width: 100%;
    max-width: 620px;

    margin: auto;

    padding:
        28px
        18px
        50px;
}


h1 {

    margin:
        0
        0
        6px;

    font-size: 38px;

    color: #17499b;

    letter-spacing: 1px;
}


.subtitle {

    margin-bottom: 26px;

    font-size: 17px;

    color: #666;

    line-height: 1.4;
}


/* =========================================
   CARDS
========================================= */

.card {

    width: 100%;

    background: white;

    border-radius: 18px;

    padding: 20px;

    margin-bottom: 18px;

    overflow: hidden;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.07);
}


/* =========================================
   UPLOAD
========================================= */

.upload-box {

    width: 100%;

    display: block;

    padding:
        28px
        15px;

    text-align: center;

    border:
        2px dashed
        #17499b;

    border-radius: 14px;

    cursor: pointer;
}


.upload-title {

    font-size: 20px;

    font-weight: bold;
}


.upload-hint {

    margin-top: 8px;

    color: #777;

    font-size: 14px;
}


input[type="file"] {
    display: none;
}


/* =========================================
   FILE INFO
========================================= */

#fileInfo {

    width: 100%;

    margin-top: 16px;

    font-size: 14px;

    line-height: 1.5;

    overflow: hidden;
}


.file-name {

    display: block;

    width: 100%;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-weight: bold;

    margin-bottom: 3px;
}


.file-size {

    color: #666;
}


/* =========================================
   BUTTONS
========================================= */

button {

    width: 100%;

    border: none;

    border-radius: 12px;

    padding: 15px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}


#startBtn {

    margin-top: 18px;

    background: #17499b;

    color: white;
}


#startBtn:disabled {

    background: #aaa;

    cursor: not-allowed;
}


#copyBtn {

    margin-top: 14px;

    background: #ff8a00;

    color: white;
}


/* =========================================
   PROGRESS
========================================= */

.step {

    margin-bottom: 25px;
}


.step:last-child {

    margin-bottom: 0;
}


.step-title {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 8px;

    font-size: 16px;

    font-weight: bold;
}


.percent {

    flex-shrink: 0;
}


.bar {

    width: 100%;

    height: 11px;

    overflow: hidden;

    border-radius: 30px;

    background: #e3e6eb;
}


.fill {

    width: 0%;

    height: 100%;

    border-radius: 30px;

    background: #17499b;

    transition:
        width 0.25s ease;
}


.detail {

    margin-top: 7px;

    font-size: 13px;

    color: #666;

    overflow-wrap: anywhere;
}


/* =========================================
   RUNNING BAR
========================================= */

.indeterminate {

    width: 35% !important;

    animation:
        movingBar
        1.2s
        infinite
        linear;
}


@keyframes movingBar {

    0% {
        transform: translateX(-120%);
    }

    100% {
        transform: translateX(320%);
    }
}


/* =========================================
   RESULT
========================================= */

.result-title {

    margin:
        0
        0
        12px;

    font-size: 18px;
}


textarea {

    display: block;

    width: 100%;

    min-height: 240px;

    padding: 14px;

    border:
        1px solid
        #d7d7d7;

    border-radius: 12px;

    resize: vertical;

    font-family:
        Arial,
        sans-serif;

    font-size: 15px;

    line-height: 1.6;

    outline: none;
}


textarea:focus {

    border-color: #17499b;
}


.success {
    color: green;
}


.error {
    color: #c62828;
}


.hidden {
    display: none;
}


/* =========================================
   MOBILE
========================================= */

@media
(max-width: 600px) {

    .app {

        max-width: 100%;

        padding:
            20px
            14px
            40px;
    }


    h1 {

        font-size: 32px;

        line-height: 1.1;
    }


    .subtitle {

        font-size: 15px;

        margin-bottom: 20px;
    }


    .card {

        padding: 17px;

        border-radius: 16px;
    }


    .upload-box {

        padding:
            24px
            10px;
    }


    .upload-title {

        font-size: 18px;
    }


    .step-title {

        font-size: 15px;
    }


    textarea {

        min-height: 210px;
    }

}

</style>

</head>



<body>


<div class="app">


    <!-- =====================================
         HEADER
    ====================================== -->

    <h1>REEL SCRIBE — OLD VERSION (test)</h1>

    <div class="subtitle">
        Reel → Text. Local AI transcription.
    </div>



    <!-- =====================================
         VIDEO
    ====================================== -->

    <div class="card">


        <label class="upload-box">


            <input
                type="file"
                id="videoInput"
                accept="video/*"
            >


            <div class="upload-title">
                Choose Reel
            </div>


            <div class="upload-hint">
                MP4, MOV, WebM
            </div>


        </label>



        <div id="fileInfo"></div>



        <button
            id="startBtn"
            disabled
        >
            TRANSCRIBE
        </button>


    </div>



    <!-- =====================================
         PROGRESS
    ====================================== -->

    <div
        class="card hidden"
        id="progressCard"
    >


        <!-- VIDEO -->

        <div class="step">


            <div class="step-title">

                <span>
                    Reading video
                </span>

                <span
                    class="percent"
                    id="readPercent"
                >
                    0%
                </span>

            </div>


            <div class="bar">

                <div
                    class="fill"
                    id="readBar"
                ></div>

            </div>


            <div
                class="detail"
                id="readDetail"
            >
                Waiting...
            </div>


        </div>



        <!-- AUDIO -->

        <div class="step">


            <div class="step-title">

                <span>
                    Preparing audio
                </span>

                <span
                    class="percent"
                    id="audioPercent"
                >
                    0%
                </span>

            </div>


            <div class="bar">

                <div
                    class="fill"
                    id="audioBar"
                ></div>

            </div>


            <div
                class="detail"
                id="audioDetail"
            >
                Waiting...
            </div>


        </div>



        <!-- MODEL -->

        <div class="step">


            <div class="step-title">

                <span>
                    AI Model
                </span>

                <span
                    class="percent"
                    id="modelPercent"
                >
                    0%
                </span>

            </div>


            <div class="bar">

                <div
                    class="fill"
                    id="modelBar"
                ></div>

            </div>


            <div
                class="detail"
                id="modelDetail"
            >
                Waiting...
            </div>


        </div>



        <!-- TRANSCRIPTION -->

        <div class="step">


            <div class="step-title">

                <span>
                    Transcribing
                </span>

                <span
                    class="percent"
                    id="transcribePercent"
                >
                    —
                </span>

            </div>


            <div class="bar">

                <div
                    class="fill"
                    id="transcribeBar"
                ></div>

            </div>


            <div
                class="detail"
                id="transcribeDetail"
            >
                Waiting...
            </div>


        </div>


    </div>



    <!-- =====================================
         RESULT
    ====================================== -->

    <div
        class="card hidden"
        id="resultCard"
    >


        <h3 class="result-title">
            Transcript
        </h3>


        <textarea
            id="result"
            placeholder="Transcript will appear here..."
        ></textarea>


        <button id="copyBtn">
            COPY TEXT
        </button>


        <div
            class="detail"
            id="copyMessage"
        ></div>


    </div>


</div>



<script type="module">


/* ==================================================
   REEL SCRIBE
================================================== */


import {
    pipeline
}
from
"./vendor/transformers/transformers.min.js"; // same 3.8.1, local copy (no outside code)
import { env as __env } from "./vendor/transformers/transformers.min.js";
__env.backends.onnx.wasm.wasmPaths = new URL("vendor/transformers/", location.href).href;



/* ==================================================
   SETTINGS
================================================== */


const MODEL =
    "Xenova/whisper-tiny";


const SAMPLE_RATE =
    16000;



/* ==================================================
   ELEMENTS
================================================== */


const videoInput =
    document.getElementById(
        "videoInput"
    );


const startBtn =
    document.getElementById(
        "startBtn"
    );


const fileInfo =
    document.getElementById(
        "fileInfo"
    );


const progressCard =
    document.getElementById(
        "progressCard"
    );


const resultCard =
    document.getElementById(
        "resultCard"
    );


const resultBox =
    document.getElementById(
        "result"
    );


const copyBtn =
    document.getElementById(
        "copyBtn"
    );


const copyMessage =
    document.getElementById(
        "copyMessage"
    );



/* ==================================================
   VARIABLES
================================================== */


let selectedFile = null;

let transcriber = null;

let audioData = null;

let audioSeconds = 0;

let runningDevice = "";



/* ==================================================
   SELECT REEL
================================================== */


videoInput.addEventListener(

    "change",

    function () {


        selectedFile =
            videoInput.files[0];


        if (!selectedFile) {
            return;
        }



        const sizeMB =

            selectedFile.size /
            1024 /
            1024;



        fileInfo.innerHTML =

            "<span class='file-name'>" +

            escapeHTML(
                selectedFile.name
            ) +

            "</span>" +

            "<span class='file-size'>" +

            sizeMB.toFixed(2) +

            " MB</span>";



        startBtn.disabled =
            false;


        startBtn.innerText =
            "TRANSCRIBE";


        resetProgress();


    }

);



/* ==================================================
   MAIN PROCESS
================================================== */


startBtn.addEventListener(

    "click",

    async function () {


        if (!selectedFile) {
            return;
        }



        startBtn.disabled =
            true;


        startBtn.innerText =
            "WORKING...";


        resultBox.value =
            "";


        copyMessage.innerHTML =
            "";


        progressCard.classList.remove(
            "hidden"
        );


        resultCard.classList.add(
            "hidden"
        );



        try {


            /* =========================================
               1. READ VIDEO
            ========================================= */


            const videoBuffer =

                await readVideo(
                    selectedFile
                );



            /* =========================================
               2. PREPARE AUDIO
            ========================================= */


            audioData =

                await prepareAudio(
                    videoBuffer
                );



            /* =========================================
               3. LOAD WHISPER
            ========================================= */


            await loadWhisper();



            /* =========================================
               4. TRANSCRIBE
            ========================================= */


            await runTranscription();



            /* =========================================
               DONE
            ========================================= */


            startBtn.innerText =
                "TRANSCRIBE ANOTHER";


            resultCard.scrollIntoView({

                behavior:
                    "smooth",

                block:
                    "start"

            });


        }

        catch (error) {


            console.error(
                error
            );


            stopTranscriptionAnimation();



            document.getElementById(

                "transcribeDetail"

            ).innerHTML =

                "<span class='error'>" +

                escapeHTML(
                    error.message
                ) +

                "</span>";



            alert(

                "Unable to transcribe.\n\n" +

                error.message

            );


            startBtn.innerText =
                "TRY AGAIN";

        }



        startBtn.disabled =
            false;


    }

);



/* ==================================================
   1. READ VIDEO
================================================== */


function readVideo(file) {


    return new Promise(

        function (
            resolve,
            reject
        ) {


            const reader =
                new FileReader();



            reader.onprogress =

                function (event) {


                    if (
                        !event.lengthComputable
                    ) {
                        return;
                    }



                    const percent =

                        Math.round(

                            event.loaded /
                            event.total *
                            100

                        );



                    setProgress(

                        "read",

                        percent,

                        formatMB(
                            event.loaded
                        ) +

                        " / " +

                        formatMB(
                            event.total
                        )

                    );


                };



            reader.onload =

                function () {


                    setProgress(

                        "read",

                        100,

                        "Video ready ✓"

                    );


                    resolve(
                        reader.result
                    );

                };



            reader.onerror =

                function () {


                    reject(

                        new Error(
                            "Could not read video."
                        )

                    );

                };



            reader.readAsArrayBuffer(
                file
            );


        }

    );

}



/* ==================================================
   2. PREPARE AUDIO
================================================== */


async function prepareAudio(
    videoBuffer
) {


    setProgress(

        "audio",

        5,

        "Opening audio..."

    );



    const AudioContextClass =

        window.AudioContext ||

        window.webkitAudioContext;



    if (!AudioContextClass) {


        throw new Error(

            "Audio processing is not supported by this browser."

        );

    }



    const audioContext =

        new AudioContextClass();



    setProgress(

        "audio",

        15,

        "Decoding audio..."

    );



    const decoded =

        await audioContext
            .decodeAudioData(

                videoBuffer.slice(0)

            );



    audioSeconds =
        decoded.duration;



    setProgress(

        "audio",

        45,

        "Creating mono audio..."

    );



    /* =========================================
       MULTI CHANNEL → MONO
    ========================================= */


    const mono =

        new Float32Array(
            decoded.length
        );



    for (

        let channel = 0;

        channel <
        decoded.numberOfChannels;

        channel++

    ) {


        const channelData =

            decoded
                .getChannelData(
                    channel
                );



        for (

            let i = 0;

            i < decoded.length;

            i++

        ) {


            mono[i] +=

                channelData[i] /

                decoded.numberOfChannels;


        }

    }



    setProgress(

        "audio",

        65,

        "Converting to 16 kHz..."

    );



    /* =========================================
       ALREADY 16 KHZ
    ========================================= */


    if (
        decoded.sampleRate ===
        SAMPLE_RATE
    ) {


        await audioContext.close();



        setProgress(

            "audio",

            100,

            "Audio ready • " +

            formatTime(
                audioSeconds
            ) +

            " ✓"

        );


        return mono;

    }



    /* =========================================
       RESAMPLE
    ========================================= */


    const targetLength =

        Math.ceil(

            mono.length *

            SAMPLE_RATE /

            decoded.sampleRate

        );



    const offlineContext =

        new OfflineAudioContext(

            1,

            targetLength,

            SAMPLE_RATE

        );



    const audioBuffer =

        offlineContext
            .createBuffer(

                1,

                mono.length,

                decoded.sampleRate

            );



    audioBuffer.copyToChannel(

        mono,

        0

    );



    const source =

        offlineContext
            .createBufferSource();



    source.buffer =
        audioBuffer;



    source.connect(

        offlineContext.destination

    );



    source.start(0);



    setProgress(

        "audio",

        80,

        "Resampling..."

    );



    const rendered =

        await offlineContext
            .startRendering();



    const finalAudio =

        rendered
            .getChannelData(0)
            .slice();



    await audioContext.close();



    setProgress(

        "audio",

        100,

        "Audio ready • " +

        formatTime(
            audioSeconds
        ) +

        " ✓"

    );



    return finalAudio;

}



/* ==================================================
   3. LOAD WHISPER
================================================== */


async function loadWhisper() {


    /* =========================================
       ALREADY LOADED
    ========================================= */


    if (transcriber) {


        setProgress(

            "model",

            100,

            "AI model ready • " +

            runningDevice +

            " ✓"

        );


        return;

    }



    setProgress(

        "model",

        1,

        "Checking model cache..."

    );



    /* =========================================
       DETECT WEBGPU
    ========================================= */


    const hasWebGPU =

        "gpu" in navigator;



    if (hasWebGPU) {


        runningDevice =
            "WebGPU";


        try {


            transcriber =

                await createPipeline(
                    "webgpu"
                );


            return;


        }

        catch (error) {


            console.warn(

                "WebGPU failed. Falling back to WASM.",

                error

            );


            transcriber =
                null;

        }

    }



    /* =========================================
       WASM FALLBACK
    ========================================= */


    runningDevice =
        "CPU";


    transcriber =

        await createPipeline(
            "wasm"
        );


}



/* ==================================================
   CREATE PIPELINE
================================================== */


async function createPipeline(
    device
) {


    let lastPercent = 0;



    const pipe =

        await pipeline(

            "automatic-speech-recognition",

            MODEL,

            {

                device:
                    device,


                dtype:
                    "q8",


                progress_callback:

                    function (data) {


                        console.log(

                            "MODEL:",

                            data

                        );



                        /* =============================
                           DOWNLOADING
                        ============================= */


                        if (

                            data.status ===
                            "progress"

                        ) {


                            let percent =

                                Number(
                                    data.progress
                                ) || 0;



                            percent =

                                Math.round(
                                    percent
                                );



                            /*
                            Several model files download.

                            Do not let progress move
                            backwards visually.
                            */


                            if (
                                percent >
                                lastPercent
                            ) {


                                lastPercent =
                                    percent;

                            }



                            let detail =

                                "Downloading AI model...";



                            if (

                                data.loaded &&
                                data.total

                            ) {


                                detail =

                                    formatMB(
                                        data.loaded
                                    ) +

                                    " / " +

                                    formatMB(
                                        data.total
                                    );

                            }



                            setProgress(

                                "model",

                                lastPercent,

                                detail

                            );


                        }



                        /* =============================
                           READY
                        ============================= */


                        if (

                            data.status ===
                            "ready"

                        ) {


                            setProgress(

                                "model",

                                100,

                                "AI model ready • " +

                                runningDevice +

                                " ✓"

                            );


                        }


                    }

            }

        );



    setProgress(

        "model",

        100,

        "AI model ready • " +

        runningDevice +

        " ✓"

    );



    return pipe;

}



/* ==================================================
   4. TRANSCRIPTION
================================================== */


async function runTranscription() {


    document.getElementById(

        "transcribePercent"

    ).innerText =
        "•••";



    document.getElementById(

        "transcribeDetail"

    ).innerText =

        formatTime(
            audioSeconds
        ) +

        " audio • " +

        runningDevice;



    startTranscriptionAnimation();



    const startTime =
        performance.now();



    /*
    =============================================
    WHISPER RUNS ON ENTIRE AUDIO.

    Transformers.js performs internal
    chunking instead of us manually running
    Whisper many times.
    =============================================
    */


    const output =

        await transcriber(

            audioData,

            {

                task:
                    "transcribe",


                chunk_length_s:
                    30,


                stride_length_s:
                    5

            }

        );



    const endTime =
        performance.now();



    stopTranscriptionAnimation();



    const processingSeconds =

        (
            endTime -
            startTime
        ) / 1000;



    let text = "";



    if (
        output &&
        output.text
    ) {


        text =
            output.text.trim();

    }



    if (!text) {


        throw new Error(

            "No speech was detected."

        );

    }



    resultBox.value =
        text;



    resultCard.classList.remove(
        "hidden"
    );



    setProgress(

        "transcribe",

        100,

        "Done in " +

        formatTime(
            processingSeconds
        ) +

        " • " +

        runningDevice +

        " ✓"

    );

}



/* ==================================================
   TRANSCRIPTION ANIMATION
================================================== */


function startTranscriptionAnimation() {


    const bar =

        document.getElementById(
            "transcribeBar"
        );


    bar.style.width =
        "35%";


    bar.classList.add(
        "indeterminate"
    );

}



function stopTranscriptionAnimation() {


    const bar =

        document.getElementById(
            "transcribeBar"
        );


    bar.classList.remove(
        "indeterminate"
    );


    bar.style.transform =
        "none";

}



/* ==================================================
   COPY
================================================== */


copyBtn.addEventListener(

    "click",

    async function () {


        const text =

            resultBox.value.trim();



        if (!text) {
            return;
        }



        try {


            await navigator.clipboard
                .writeText(
                    text
                );



            copyBtn.innerText =
                "COPIED ✓";


            copyMessage.innerHTML =

                "<span class='success'>" +

                "Transcript copied" +

                "</span>";



        }

        catch {


            /*
            Fallback for browsers where
            clipboard API is blocked.
            */


            resultBox.select();



            document.execCommand(
                "copy"
            );



            copyBtn.innerText =
                "COPIED ✓";


        }



        setTimeout(

            function () {


                copyBtn.innerText =
                    "COPY TEXT";


                copyMessage.innerHTML =
                    "";


            },

            1800

        );


    }

);



/* ==================================================
   PROGRESS
================================================== */


function setProgress(

    name,
    percent,
    detail

) {


    percent =

        Math.max(

            0,

            Math.min(

                100,

                Number(percent) || 0

            )

        );



    document.getElementById(

        name +
        "Percent"

    ).innerText =

        Math.round(
            percent
        ) +

        "%";



    document.getElementById(

        name +
        "Bar"

    ).style.width =

        percent +
        "%";



    document.getElementById(

        name +
        "Detail"

    ).innerText =
        detail;

}



/* ==================================================
   RESET
================================================== */


function resetProgress() {


    setProgress(

        "read",

        0,

        "Waiting..."

    );



    setProgress(

        "audio",

        0,

        "Waiting..."

    );



    if (transcriber) {


        setProgress(

            "model",

            100,

            "AI model already loaded • " +

            runningDevice

        );

    }

    else {


        setProgress(

            "model",

            0,

            "Waiting..."

        );

    }



    setProgress(

        "transcribe",

        0,

        "Waiting..."

    );



    resultBox.value =
        "";


    resultCard.classList.add(
        "hidden"
    );

}



/* ==================================================
   MB
================================================== */


function formatMB(
    bytes
) {


    return (

        bytes /
        1024 /
        1024

    ).toFixed(1) +

    " MB";

}



/* ==================================================
   TIME
================================================== */


function formatTime(
    seconds
) {


    seconds =

        Math.max(

            0,

            Math.round(
                seconds
            )

        );



    const minutes =

        Math.floor(

            seconds /
            60

        );



    const remaining =

        seconds %
        60;



    return (

        String(minutes)
            .padStart(
                2,
                "0"
            )

        +

        ":"

        +

        String(remaining)
            .padStart(
                2,
                "0"
            )

    );

}



/* ==================================================
   BASIC HTML ESCAPE
================================================== */


function escapeHTML(
    text
) {


    const div =

        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}
