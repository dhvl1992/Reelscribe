# Copies the AI library (Transformers.js) and its speech engine (ONNX Runtime) from npm into vendor/,
# so ReelScribe never loads code from an outside CDN (all dhvl1992 apps share one site + login).
# Runs when this file changes, or by hand: Actions → Vendor Transformers → Run workflow.
name: Vendor Transformers

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/vendor-transformers.yml"]

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download from npm and copy browser files
        run: |
          set -e
          mkdir -p /tmp/pkg && cd /tmp/pkg
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @huggingface/transformers@3.8.1 >/dev/null  # files only; skip server-side GPU add-on downloads
          cd "$GITHUB_WORKSPACE"
          rm -rf vendor && mkdir -p vendor/transformers
          T=/tmp/pkg/node_modules/@huggingface/transformers
          O=/tmp/pkg/node_modules/onnxruntime-web
          echo "--- transformers dist:"; ls -la $T/dist
          echo "--- onnxruntime-web dist:"; ls -la $O/dist | head -80
          # Only what the browser needs: the self-contained build (same file the CDN served)
          # + its speech engine (one file pair does both CPU and WebGPU)
          rm -rf vendor/ort
          cp $T/dist/transformers.min.js vendor/transformers/
          cp $T/dist/ort-wasm-simd-threaded.jsep.wasm $T/dist/ort-wasm-simd-threaded.jsep.mjs vendor/transformers/
          echo "--- outside imports in transformers.min.js (should be none):"
          grep -o '^import[^;]*;' vendor/transformers/transformers.min.js || echo "none"
          (
            echo "@huggingface/transformers $(node -p "require('$T/package.json').version")"
            echo "onnxruntime-web $(node -p "require('$O/package.json').version")"
            echo "source: npm registry"
            cd vendor && find . -type f ! -name VERSIONS.txt | sort | while read f; do echo "$(stat -c %s "$f") sha384-$(openssl dgst -sha384 -binary "$f" | openssl base64 -A) $f"; done
          ) > /tmp/VERSIONS.txt
          mv /tmp/VERSIONS.txt vendor/VERSIONS.txt
          cat vendor/VERSIONS.txt
          du -sh vendor
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add vendor
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "Vendor Transformers.js 3.8.1 + ONNX Runtime wasm from npm"
          git push
