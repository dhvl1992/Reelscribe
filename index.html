<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReelScribe · dhvl1992</title>
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#fafafa">
<!-- Shared look + one installable app (dhvl1992) for everything — see /DESIGN.md in the hub repo -->
<link rel="stylesheet" href="/theme.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<style>
  /* App-specific styles only. Colors, font, spacing and shapes come from /theme.css. */
  .pick{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:150px;
        background:var(--soft); border-radius:var(--r-ctl); cursor:pointer; text-align:center; padding:var(--s3)}
  .pick input{display:none}
  .pick b{font-weight:500}
  .pick span{font-size:var(--fs-sm); color:var(--muted)}
  .file{display:flex; justify-content:space-between; gap:var(--s1); margin-top:var(--s2); font-size:15px}
  .file .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .file .size{color:var(--muted); flex:none}
  .wide{width:100%; margin-top:var(--s2)}
  .btn:disabled{opacity:.45; cursor:default}
  .step{margin-top:var(--s2)}
  .step:first-child{margin-top:0}
  .step-top{display:flex; justify-content:space-between; font-size:15px}
  .step-top .pc{color:var(--muted)}
  .track{height:6px; background:var(--soft); border-radius:var(--r-pill); margin-top:6px; overflow:hidden}
  .fill{height:100%; width:0; background:var(--accent); border-radius:var(--r-pill); transition:width .3s}
  .fill.busy{width:35% !important; animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)} 100%{transform:translateX(300%)}}
  .detail{font-size:var(--fs-sm); color:var(--muted); margin-top:4px}
  .result-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:var(--s1)}
  .result-head h2{font-size:var(--fs-lg); font-weight:500; margin:0}
  textarea.input{min-height:220px; padding:var(--s2); line-height:1.6; resize:vertical}
  .row{display:flex; gap:var(--s1); margin-top:var(--s2)}
  .row .btn{flex:1}
  .note{margin-top:var(--s2)}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">ReelScribe</h1>
  <p class="sub">Video or voice note → text. Runs on this phone; your file never leaves it.</p>

  <!-- 1. Pick a file -->
  <div class="card">
    <label class="pick">
      <input type="file" id="fileIn" accept="video/*,audio/*">
      <b>Tap to choose a reel or audio</b>
      <span>MP4, MOV, WebM, MP3, M4A, OGG, WhatsApp voice notes</span>
    </label>
    <div class="file hidden" id="fileInfo"><span class="name" id="fileName"></span><span class="size" id="fileSize"></span></div>
    <button class="btn btn-primary wide" id="startBtn" disabled>Transcribe</button>
    <div class="note hidden" id="errorBox"></div>
  </div>

  <!-- 2. Progress -->
  <div class="card hidden" id="progressCard">
    <div class="step"><div class="step-top"><span>Reading file</span><span class="pc" id="readPc">0%</span></div>
      <div class="track"><div class="fill" id="readBar"></div></div><div class="detail" id="readDetail">Waiting…</div></div>
    <div class="step"><div class="step-top"><span>Preparing audio</span><span class="pc" id="audioPc">0%</span></div>
      <div class="track"><div class="fill" id="audioBar"></div></div><div class="detail" id="audioDetail">Waiting…</div></div>
    <div class="step"><div class="step-top"><span>AI model</span><span class="pc" id="modelPc">0%</span></div>
      <div class="track"><div class="fill" id="modelBar"></div></div><div class="detail" id="modelDetail">Waiting…</div></div>
    <div class="step"><div class="step-top"><span>Transcribing</span><span class="pc" id="textPc">—</span></div>
      <div class="track"><div class="fill" id="textBar"></div></div><div class="detail" id="textDetail">Waiting…</div></div>
  </div>

  <!-- 3. Result -->
  <div class="card hidden" id="resultCard">
    <div class="result-head"><h2>Transcript</h2><span class="sub" id="resultMeta" style="margin:0"></span></div>
    <textarea class="input" id="result"></textarea>
    <div class="row"><button class="btn btn-primary" id="copyBtn">Copy text</button></div>
  </div>
</div>

<script type="module">
// ============ ReelScribe ============
// Flow: file → read → decode audio → mono 16 kHz → Whisper (on this device) → text.
// The AI library is a local copy (vendor/, made by .github/workflows/vendor-transformers.yml): no outside code runs here.
import { pipeline, env } from "./vendor/transformers/transformers.min.js";

// Same model + settings as the original ReelScribe, so transcripts stay the same
const MODEL = "Xenova/whisper-tiny";
const SAMPLE_RATE = 16000;
env.backends.onnx.wasm.wasmPaths = new URL("vendor/transformers/", location.href).href; // speech engine from this repo, not a CDN

const $ = (id) => document.getElementById(id);
let file = null, transcriber = null, device = "";

// ---------- 1. pick ----------
$("fileIn").addEventListener("change", () => {
  file = $("fileIn").files[0];
  if (!file) return;
  $("fileName").textContent = file.name;
  $("fileSize").textContent = mb(file.size);
  $("fileInfo").classList.remove("hidden");
  $("startBtn").disabled = false;
  $("startBtn").textContent = "Transcribe";
  showError("");
  resetProgress();
});

// ---------- main ----------
$("startBtn").addEventListener("click", async () => {
  if (!file) return;
  const btn = $("startBtn");
  btn.disabled = true; btn.textContent = "Working…";
  showError("");
  $("progressCard").classList.remove("hidden");
  $("resultCard").classList.add("hidden");
  try {
    const buffer = await readFile(file);
    const { audio, seconds } = await prepareAudio(buffer);
    await loadWhisper();
    await transcribe(audio, seconds);
    btn.textContent = "Transcribe another";
    $("resultCard").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    console.error(e);
    $("textBar").classList.remove("busy");
    showError(friendly(e));
    btn.textContent = "Try again";
  }
  btn.disabled = false;
});

// ---------- 1. read ----------
function readFile(f) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onprogress = (e) => { if (e.lengthComputable) setStep("read", (e.loaded / e.total) * 100, `${mb(e.loaded)} / ${mb(e.total)}`); };
    r.onload = () => { setStep("read", 100, "File ready ✓"); resolve(r.result); };
    r.onerror = () => reject(new Error("READ"));
    r.readAsArrayBuffer(f);
  });
}

// ---------- 2. audio: decode, mix to mono, resample to 16 kHz ----------
async function prepareAudio(buffer) {
  setStep("audio", 10, "Decoding audio…");
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) throw new Error("NOAUDIO");
  const ctx = new Ctx();
  let decoded;
  try { decoded = await ctx.decodeAudioData(buffer.slice(0)); }
  catch { await ctx.close(); throw new Error("DECODE"); }
  const seconds = decoded.duration;

  setStep("audio", 45, "Mixing to mono…");
  const mono = new Float32Array(decoded.length);
  for (let c = 0; c < decoded.numberOfChannels; c++) {
    const data = decoded.getChannelData(c);
    for (let i = 0; i < decoded.length; i++) mono[i] += data[i] / decoded.numberOfChannels;
  }
  await ctx.close();
  if (decoded.sampleRate === SAMPLE_RATE) { setStep("audio", 100, `Audio ready · ${clock(seconds)} ✓`); return { audio: mono, seconds }; }

  setStep("audio", 70, "Converting to 16 kHz…");
  const off = new OfflineAudioContext(1, Math.ceil((mono.length * SAMPLE_RATE) / decoded.sampleRate), SAMPLE_RATE);
  const buf = off.createBuffer(1, mono.length, decoded.sampleRate);
  buf.copyToChannel(mono, 0);
  const src = off.createBufferSource();
  src.buffer = buf; src.connect(off.destination); src.start(0);
  const audio = (await off.startRendering()).getChannelData(0).slice();
  setStep("audio", 100, `Audio ready · ${clock(seconds)} ✓`);
  return { audio, seconds };
}

// ---------- 3. model: WebGPU if the phone has it, else CPU. Cached after the first download. ----------
async function loadWhisper() {
  if (transcriber) { setStep("model", 100, `AI model ready · ${device} ✓`); return; }
  setStep("model", 1, "Checking saved model…");
  if ("gpu" in navigator) {
    try { device = "WebGPU"; transcriber = await makePipeline("webgpu"); return; }
    catch (e) { console.warn("WebGPU failed, using CPU", e); transcriber = null; }
  }
  device = "CPU";
  transcriber = await makePipeline("wasm");
}
async function makePipeline(dev) {
  let last = 0;
  const pipe = await pipeline("automatic-speech-recognition", MODEL, {
    device: dev, dtype: "q8",
    progress_callback: (d) => {
      if (d.status === "progress") {
        last = Math.max(last, Math.round(Number(d.progress) || 0));
        setStep("model", last, d.loaded && d.total ? `Downloading AI model (first time only) · ${mb(d.loaded)} / ${mb(d.total)}` : "Loading AI model…");
      }
    },
  });
  setStep("model", 100, `AI model ready · ${device} ✓`);
  return pipe;
}

// ---------- 4. transcribe ----------
async function transcribe(audio, seconds) {
  $("textPc").textContent = "•••";
  $("textDetail").textContent = `${clock(seconds)} of audio · ${device}`;
  $("textBar").classList.add("busy");
  const t0 = performance.now();
  const out = await transcriber(audio, { task: "transcribe", chunk_length_s: 30, stride_length_s: 5 });
  $("textBar").classList.remove("busy");
  const text = (out?.text || "").trim();
  if (!text) throw new Error("NOSPEECH");
  $("result").value = text;
  $("resultMeta").textContent = `${text.split(/\s+/).length} words`;
  $("resultCard").classList.remove("hidden");
  setStep("text", 100, `Done in ${clock((performance.now() - t0) / 1000)} · ${device} ✓`);
}

// ---------- copy ----------
$("copyBtn").addEventListener("click", async () => {
  const text = $("result").value.trim();
  if (!text) return;
  try { await navigator.clipboard.writeText(text); } catch { $("result").select(); document.execCommand("copy"); }
  $("copyBtn").textContent = "Copied ✓";
  setTimeout(() => ($("copyBtn").textContent = "Copy text"), 1800);
});

// ---------- helpers ----------
function setStep(name, pct, detail) {
  pct = Math.max(0, Math.min(100, Number(pct) || 0));
  $(name + "Pc").textContent = Math.round(pct) + "%";
  $(name + "Bar").style.width = pct + "%";
  $(name + "Detail").textContent = detail;
}
function resetProgress() {
  setStep("read", 0, "Waiting…");
  setStep("audio", 0, "Waiting…");
  transcriber ? setStep("model", 100, `AI model already loaded · ${device}`) : setStep("model", 0, "Waiting…");
  setStep("text", 0, "Waiting…"); $("textPc").textContent = "—";
  $("result").value = "";
  $("resultCard").classList.add("hidden");
}
function showError(msg) { $("errorBox").textContent = msg; $("errorBox").classList.toggle("hidden", !msg); }
// Plain-English errors with a next step
function friendly(e) {
  const m = e?.message || "";
  if (m === "READ") return "Couldn't read this file. Choose it again, or save it to the phone first.";
  if (m === "NOAUDIO") return "This browser can't process audio. Open ReelScribe in Chrome.";
  if (m === "DECODE") return "Couldn't read the sound in this file. Try an MP4 or M4A version (iPhone MOV videos sometimes fail on Android).";
  if (m === "NOSPEECH") return "No speech found. The video may have only music or no sound.";
  if (/fetch|network|Failed to load/i.test(m)) return "Couldn't download the AI model. Check the internet and try again (needed only the first time).";
  if (/memory|allocation/i.test(m)) return "The phone ran out of memory. Close other apps, or try a shorter file.";
  return "Something went wrong: " + m;
}
const mb = (b) => (b / 1024 / 1024).toFixed(1) + " MB";
const clock = (s) => { s = Math.max(0, Math.round(s)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
</script>
<!-- Shared top bar (logo → home, account menu): /topbar.js in the hub repo -->
<script src="/topbar.js"></script>
</body>
</html>
