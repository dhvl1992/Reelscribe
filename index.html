<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17499b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Reel Scribe</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111;
    }

    .app {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 24px 14px 44px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 32px;
      line-height: 1.1;
      color: #17499b;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin-bottom: 20px;
      color: #666;
      font-size: 15px;
      line-height: 1.4;
    }

    .card {
      width: 100%;
      background: #fff;
      border-radius: 16px;
      padding: 17px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
    }

    .upload-box {
      display: block;
      width: 100%;
      padding: 24px 10px;
      text-align: center;
      border: 2px dashed #17499b;
      border-radius: 13px;
      cursor: pointer;
    }

    .upload-title {
      font-size: 18px;
      font-weight: 700;
    }

    .upload-hint,
    .detail,
    .file-size {
      font-size: 13px;
      color: #666;
    }

    .upload-hint { margin-top: 7px; }

    input[type="file"] { display: none; }

    #fileInfo {
      width: 100%;
      margin-top: 14px;
      overflow: hidden;
      line-height: 1.45;
    }

    .file-name {
      display: block;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    #startBtn {
      margin-top: 16px;
      background: #17499b;
      color: #fff;
    }

    #startBtn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #copyBtn {
      margin-top: 13px;
      background: #ff8a00;
      color: #fff;
    }

    .step { margin-bottom: 23px; }
    .step:last-child { margin-bottom: 0; }

    .step-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 700;
    }

    .percent { flex-shrink: 0; }

    .bar {
      width: 100%;
      height: 10px;
      overflow: hidden;
      border-radius: 30px;
      background: #e4e7ec;
    }

    .fill {
      width: 0%;
      height: 100%;
      border-radius: 30px;
      background: #17499b;
      transition: width .2s ease;
    }

    .detail {
      margin-top: 7px;
      overflow-wrap: anywhere;
    }

    .indeterminate {
      width: 34% !important;
      animation: movingBar 1.1s infinite linear;
    }

    @keyframes movingBar {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }

    .result-title {
      margin: 0 0 11px;
      font-size: 18px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 220px;
      padding: 13px;
      border: 1px solid #d7d7d7;
      border-radius: 11px;
      resize: vertical;
      font: 15px/1.55 Arial, sans-serif;
      outline: none;
    }

    textarea:focus { border-color: #17499b; }

    .success { color: #087a35; }
    .error { color: #c62828; }
    .hidden { display: none; }

    @media (min-width: 700px) {
      .app { padding: 30px 18px 50px; }
      h1 { font-size: 38px; }
      .subtitle { font-size: 17px; }
      .card { padding: 20px; }
    }
  </style>
</head>

<body>
<div class="app">

  <h1>REEL SCRIBE</h1>
  <div class="subtitle">Reel → Text. Local AI transcription.</div>

  <div class="card">
    <label class="upload-box">
      <input type="file" id="videoInput" accept="video/*">
      <div class="upload-title">Choose Reel</div>
      <div class="upload-hint">MP4, MOV, WebM</div>
    </label>

    <div id="fileInfo"></div>

    <button id="startBtn" disabled>TRANSCRIBE</button>
  </div>

  <div class="card hidden" id="progressCard">

    <div class="step">
      <div class="step-title">
        <span>Reading video</span>
        <span class="percent" id="readPercent">0%</span>
      </div>
      <div class="bar"><div class="fill" id="readBar"></div></div>
      <div class="detail" id="readDetail">Waiting...</div>
    </div>

    <div class="step">
      <div class="step-title">
        <span>Preparing audio</span>
        <span class="percent" id="audioPercent">0%</span>
      </div>
      <div class="bar"><div class="fill" id="audioBar"></div></div>
      <div class="detail" id="audioDetail">Waiting...</div>
    </div>

    <div class="step">
      <div class="step-title">
        <span>AI Model</span>
        <span class="percent" id="modelPercent">0%</span>
      </div>
      <div class="bar"><div class="fill" id="modelBar"></div></div>
      <div class="detail" id="modelDetail">Waiting...</div>
    </div>

    <div class="step">
      <div class="step-title">
        <span>Transcribing</span>
        <span class="percent" id="transcribePercent">—</span>
      </div>
      <div class="bar"><div class="fill" id="transcribeBar"></div></div>
      <div class="detail" id="transcribeDetail">Waiting...</div>
    </div>

  </div>

  <div class="card hidden" id="resultCard">
    <h3 class="result-title">Transcript</h3>
    <textarea id="result" placeholder="Transcript will appear here..."></textarea>
    <button id="copyBtn">COPY TEXT</button>
    <div class="detail" id="copyMessage"></div>
  </div>

</div>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

const MODEL = "Xenova/whisper-tiny";
const SAMPLE_RATE = 16000;

const videoInput = document.getElementById("videoInput");
const startBtn = document.getElementById("startBtn");
const fileInfo = document.getElementById("fileInfo");
const progressCard = document.getElementById("progressCard");
const resultCard = document.getElementById("resultCard");
const resultBox = document.getElementById("result");
const copyBtn = document.getElementById("copyBtn");
const copyMessage = document.getElementById("copyMessage");

let selectedFile = null;
let transcriber = null;
let audioData = null;
let audioSeconds = 0;
let runningDevice = "";

if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      await navigator.serviceWorker.register("./sw.js");
      console.log("Service worker ready");
    } catch (error) {
      console.warn("Service worker registration failed:", error);
    }
  });
}

videoInput.addEventListener("change", () => {
  selectedFile = videoInput.files[0];
  if (!selectedFile) return;

  const sizeMB = selectedFile.size / 1024 / 1024;

  fileInfo.innerHTML =
    "<span class='file-name'>" +
    escapeHTML(selectedFile.name) +
    "</span>" +
    "<span class='file-size'>" +
    sizeMB.toFixed(2) +
    " MB</span>";

  startBtn.disabled = false;
  startBtn.innerText = "TRANSCRIBE";
  resetProgress();
});

startBtn.addEventListener("click", async () => {
  if (!selectedFile) return;

  startBtn.disabled = true;
  startBtn.innerText = "WORKING...";
  resultBox.value = "";
  copyMessage.innerHTML = "";
  progressCard.classList.remove("hidden");
  resultCard.classList.add("hidden");

  try {
    const videoBuffer = await readVideo(selectedFile);
    audioData = await prepareAudio(videoBuffer);
    await loadWhisper();
    await runTranscription();

    startBtn.innerText = "TRANSCRIBE ANOTHER";
    resultCard.scrollIntoView({ behavior: "smooth", block: "start" });

  } catch (error) {
    console.error(error);
    stopTranscriptionAnimation();

    document.getElementById("transcribeDetail").innerHTML =
      "<span class='error'>" + escapeHTML(error.message) + "</span>";

    alert("Unable to transcribe.\n\n" + error.message);
    startBtn.innerText = "TRY AGAIN";
  }

  startBtn.disabled = false;
});

function readVideo(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onprogress = (event) => {
      if (!event.lengthComputable) return;

      const percent = Math.round(event.loaded / event.total * 100);

      setProgress(
        "read",
        percent,
        formatMB(event.loaded) + " / " + formatMB(event.total)
      );
    };

    reader.onload = () => {
      setProgress("read", 100, "Video ready ✓");
      resolve(reader.result);
    };

    reader.onerror = () => {
      reject(new Error("Could not read video."));
    };

    reader.readAsArrayBuffer(file);
  });
}

async function prepareAudio(videoBuffer) {
  setProgress("audio", 5, "Opening audio...");

  const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContextClass) {
    throw new Error("Audio processing is not supported by this browser.");
  }

  const audioContext = new AudioContextClass();

  setProgress("audio", 15, "Decoding audio...");

  const decoded =
    await audioContext.decodeAudioData(videoBuffer.slice(0));

  audioSeconds = decoded.duration;

  setProgress("audio", 45, "Creating mono audio...");

  const mono = new Float32Array(decoded.length);

  for (let channel = 0; channel < decoded.numberOfChannels; channel++) {
    const channelData = decoded.getChannelData(channel);

    for (let i = 0; i < decoded.length; i++) {
      mono[i] += channelData[i] / decoded.numberOfChannels;
    }
  }

  setProgress("audio", 65, "Converting to 16 kHz...");

  if (decoded.sampleRate === SAMPLE_RATE) {
    await audioContext.close();

    setProgress(
      "audio",
      100,
      "Audio ready • " + formatTime(audioSeconds) + " ✓"
    );

    return mono;
  }

  const targetLength =
    Math.ceil(mono.length * SAMPLE_RATE / decoded.sampleRate);

  const offlineContext =
    new OfflineAudioContext(1, targetLength, SAMPLE_RATE);

  const audioBuffer =
    offlineContext.createBuffer(1, mono.length, decoded.sampleRate);

  audioBuffer.copyToChannel(mono, 0);

  const source = offlineContext.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(offlineContext.destination);
  source.start(0);

  setProgress("audio", 80, "Resampling...");

  const rendered = await offlineContext.startRendering();
  const finalAudio = rendered.getChannelData(0).slice();

  await audioContext.close();

  setProgress(
    "audio",
    100,
    "Audio ready • " + formatTime(audioSeconds) + " ✓"
  );

  return finalAudio;
}

async function loadWhisper() {
  if (transcriber) {
    setProgress(
      "model",
      100,
      "AI model ready • " + runningDevice + " ✓"
    );
    return;
  }

  setProgress("model", 1, "Checking model cache...");

  const hasWebGPU = "gpu" in navigator;

  if (hasWebGPU) {
    runningDevice = "WebGPU";

    try {
      transcriber = await createPipeline("webgpu");
      return;
    } catch (error) {
      console.warn("WebGPU failed. Falling back to CPU/WASM.", error);
      transcriber = null;
    }
  }

  runningDevice = "CPU";
  transcriber = await createPipeline(null);
}

async function createPipeline(device) {
  let lastPercent = 0;

  const options = {
    dtype: "q8",

    progress_callback: (data) => {
      console.log("MODEL:", data);

      if (data.status === "progress") {
        let percent = Number(data.progress) || 0;
        percent = Math.round(percent);

        if (percent > lastPercent) {
          lastPercent = percent;
        }

        let detail = "Downloading AI model...";

        if (data.loaded && data.total) {
          detail =
            formatMB(data.loaded) +
            " / " +
            formatMB(data.total);
        }

        setProgress(
          "model",
          lastPercent,
          detail
        );
      }

      if (data.status === "ready") {
        setProgress(
          "model",
          100,
          "AI model ready • " + runningDevice + " ✓"
        );
      }
    }
  };

  if (device) {
    options.device = device;
  }

  const pipe =
    await pipeline(
      "automatic-speech-recognition",
      MODEL,
      options
    );

  setProgress(
    "model",
    100,
    "AI model ready • " + runningDevice + " ✓"
  );

  return pipe;
}

async function runTranscription() {
  document.getElementById("transcribePercent").innerText = "•••";

  document.getElementById("transcribeDetail").innerText =
    formatTime(audioSeconds) +
    " audio • " +
    runningDevice;

  startTranscriptionAnimation();

  const startTime = performance.now();

  const output =
    await transcriber(
      audioData,
      {
        task: "transcribe",
        chunk_length_s: 30,
        stride_length_s: 5
      }
    );

  const endTime = performance.now();

  stopTranscriptionAnimation();

  const processingSeconds =
    (endTime - startTime) / 1000;

  const text =
    output && output.text
      ? output.text.trim()
      : "";

  if (!text) {
    throw new Error("No speech was detected.");
  }

  resultBox.value = text;
  resultCard.classList.remove("hidden");

  setProgress(
    "transcribe",
    100,
    "Done in " +
    formatTime(processingSeconds) +
    " • " +
    runningDevice +
    " ✓"
  );
}

function startTranscriptionAnimation() {
  const bar = document.getElementById("transcribeBar");

  bar.style.width = "34%";
  bar.classList.add("indeterminate");
}

function stopTranscriptionAnimation() {
  const bar = document.getElementById("transcribeBar");

  bar.classList.remove("indeterminate");
  bar.style.transform = "none";
}

copyBtn.addEventListener("click", async () => {
  const text = resultBox.value.trim();
  if (!text) return;

  try {
    await navigator.clipboard.writeText(text);
  } catch {
    resultBox.select();
    document.execCommand("copy");
  }

  copyBtn.innerText = "COPIED ✓";
  copyMessage.innerHTML =
    "<span class='success'>Transcript copied</span>";

  setTimeout(() => {
    copyBtn.innerText = "COPY TEXT";
    copyMessage.innerHTML = "";
  }, 1800);
});

function setProgress(name, percent, detail) {
  percent =
    Math.max(
      0,
      Math.min(100, Number(percent) || 0)
    );

  document.getElementById(name + "Percent").innerText =
    Math.round(percent) + "%";

  document.getElementById(name + "Bar").style.width =
    percent + "%";

  document.getElementById(name + "Detail").innerText =
    detail;
}

function resetProgress() {
  setProgress("read", 0, "Waiting...");
  setProgress("audio", 0, "Waiting...");

  if (transcriber) {
    setProgress(
      "model",
      100,
      "AI model already loaded • " + runningDevice
    );
  } else {
    setProgress("model", 0, "Waiting...");
  }

  setProgress("transcribe", 0, "Waiting...");

  resultBox.value = "";
  resultCard.classList.add("hidden");
}

function formatMB(bytes) {
  return (bytes / 1024 / 1024).toFixed(1) + " MB";
}

function formatTime(seconds) {
  seconds =
    Math.max(
      0,
      Math.round(seconds)
    );

  const minutes =
    Math.floor(seconds / 60);

  const remaining =
    seconds % 60;

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(remaining).padStart(2, "0")
  );
}

function escapeHTML(text) {
  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}
</script>

</body>
</html>
