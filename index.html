<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReelScribe · dhvl1992</title>
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#fafafa">
<!-- Shared look + one installable app (dhvl1992) for everything — see /DESIGN.md in the hub repo -->
<link rel="stylesheet" href="/theme.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<style>
  /* App-specific styles only. Colors, font, spacing and shapes come from /theme.css. */
  .pick{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:150px;
        background:var(--soft); border-radius:var(--r-ctl); cursor:pointer; text-align:center; padding:var(--s3)}
  .pick input{display:none}
  .pick b{font-weight:500}
  .pick span{font-size:var(--fs-sm); color:var(--muted)}
  .file{display:flex; justify-content:space-between; gap:var(--s1); margin-top:var(--s2); font-size:15px}
  .file .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .file .size{color:var(--muted); flex:none}
  .wide{width:100%; margin-top:var(--s2)}
  .btn:disabled{opacity:.45; cursor:default}
  .step{margin-top:var(--s2)}
  .step:first-child{margin-top:0}
  .step-top{display:flex; justify-content:space-between; font-size:15px}
  .step-top .pc{color:var(--muted)}
  .track{height:6px; background:var(--soft); border-radius:var(--r-pill); margin-top:6px; overflow:hidden}
  .fill{height:100%; width:0; background:var(--accent); border-radius:var(--r-pill); transition:width .3s}
  .fill.busy{width:35% !important; animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)} 100%{transform:translateX(300%)}}
  .detail{font-size:var(--fs-sm); color:var(--muted); margin-top:4px}
  .result-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:var(--s1)}
  .result-head h2{font-size:var(--fs-lg); font-weight:500; margin:0}
  textarea.input{min-height:220px; padding:var(--s2); line-height:1.6; resize:vertical}
  .row{display:flex; gap:var(--s1); margin-top:var(--s2)}
  .row .btn{flex:1; white-space:nowrap; padding:0 var(--s2)}
  .note{margin-top:var(--s2)}
  .hidden{display:none !important}
  .msg{font-size:var(--fs-sm); color:var(--muted); margin-top:var(--s1); min-height:20px}
  .msg a{color:var(--accent); text-decoration:none}
  .msg button{border:0; background:none; color:var(--accent); padding:0; font:inherit; cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">ReelScribe</h1>
  <p class="sub">Video or voice note → text. Runs on this phone; your file never leaves it. <span style="opacity:.6">· v27-11 16:30</span></p>

  <!-- 1. Pick a file -->
  <div class="card">
    <label class="pick">
      <input type="file" id="fileIn" accept="video/*,audio/*">
      <b>Tap to choose a reel or audio</b>
      <span>MP4, MOV, WebM, MP3, M4A, OGG, WhatsApp voice notes</span>
    </label>
    <div class="file hidden" id="fileInfo"><span class="name" id="fileName"></span><span class="size" id="fileSize"></span></div>
    <button class="btn btn-primary wide" id="startBtn" disabled>Transcribe</button>
    <div class="note hidden" id="errorBox"></div>
  </div>

  <!-- 2. Progress -->
  <div class="card hidden" id="progressCard">
    <div class="step"><div class="step-top"><span>Reading file</span><span class="pc" id="readPc">0%</span></div>
      <div class="track"><div class="fill" id="readBar"></div></div><div class="detail" id="readDetail">Waiting…</div></div>
    <div class="step"><div class="step-top"><span>Preparing audio</span><span class="pc" id="audioPc">0%</span></div>
      <div class="track"><div class="fill" id="audioBar"></div></div><div class="detail" id="audioDetail">Waiting…</div></div>
    <div class="step"><div class="step-top"><span>AI model</span><span class="pc" id="modelPc">0%</span></div>
      <div class="track"><div class="fill" id="modelBar"></div></div><div class="detail" id="modelDetail">Waiting…</div></div>
    <div class="step"><div class="step-top"><span>Transcribing</span><span class="pc" id="textPc">—</span></div>
      <div class="track"><div class="fill" id="textBar"></div></div><div class="detail" id="textDetail">Waiting…</div></div>
  </div>

  <!-- 3. Result -->
  <div class="card hidden" id="resultCard">
    <div class="result-head"><h2>Transcript</h2><span class="sub" id="resultMeta" style="margin:0"></span></div>
    <textarea class="input" id="result"></textarea>
    <div class="row">
      <button class="btn" id="cleanBtn">✨ Clean up</button>
      <button class="btn" id="copyBtn">Copy text</button>
    </div>
    <button class="btn btn-primary wide" id="saveBtn">Save to MyBrain</button>
    <div class="msg" id="actMsg"></div>
  </div>
</div>

<script type="module">
// ============ ReelScribe ============
// Flow: file → read → decode audio → mono 16 kHz → Whisper (on this device) → text.
// The AI library is a local copy (vendor/, made by .github/workflows/vendor-transformers.yml): no outside code runs here.
import { pipeline, env } from "./vendor/transformers/transformers.min.js";

// Same model + settings as the original ReelScribe, so transcripts stay the same
const MODEL = "Xenova/whisper-tiny";
const SAMPLE_RATE = 16000;
env.backends.onnx.wasm.wasmPaths = new URL("vendor/transformers/", location.href).href; // speech engine from this repo, not a CDN

const $ = (id) => document.getElementById(id);
let file = null, transcriber = null, device = "";

// ---------- 1. pick ----------
$("fileIn").addEventListener("change", () => selectFile($("fileIn").files[0]));
function selectFile(f) {
  file = f;
  if (!file) return;
  $("fileName").textContent = file.name;
  $("fileSize").textContent = mb(file.size);
  $("fileInfo").classList.remove("hidden");
  $("startBtn").disabled = false;
  $("startBtn").textContent = "Transcribe";
  showError("");
  resetProgress();
}

// ---------- Shared from Gallery / WhatsApp ("Share → dhvl1992") ----------
// The home page's service worker (/sw.js) received the file and kept it in browser storage; pick it up here.
async function pickUpShared() {
  const q = new URLSearchParams(location.search).get("shared");
  if (q === null) return;
  history.replaceState(null, "", location.pathname); // clean address, so a reload doesn't repeat this
  if (q !== "1" || !("caches" in window)) return showError("Couldn't receive the shared file. Open it with “Tap to choose” instead.");
  try {
    const cache = await caches.open("share-inbox");
    const res = await cache.match("/shared-file");
    if (!res) return showError("The shared file was not found. Share it again, or tap to choose it.");
    const blob = await res.blob();
    const name = decodeURIComponent(res.headers.get("X-File-Name") || "shared");
    await cache.delete("/shared-file"); // don't keep a copy around
    selectFile(new File([blob], name, { type: blob.type || res.headers.get("Content-Type") || "" }));
    $("startBtn").click(); // start right away
  } catch (e) { console.error(e); showError("Couldn't receive the shared file. Tap to choose it instead."); }
}
pickUpShared();

// ---------- main ----------
$("startBtn").addEventListener("click", async () => {
  if (!file) return;
  const btn = $("startBtn");
  btn.disabled = true; btn.textContent = "Working…";
  showError("");
  $("progressCard").classList.remove("hidden");
  $("resultCard").classList.add("hidden");
  try {
    const buffer = await readFile(file);
    const { audio, seconds } = await prepareAudio(buffer);
    await loadWhisper();
    await transcribe(audio, seconds);
    btn.textContent = "Transcribe another";
    $("resultCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (e) {
    console.error(e);
    $("textBar").classList.remove("busy");
    showError(friendly(e));
    btn.textContent = "Try again";
  }
  btn.disabled = false;
});

// ---------- 1. read ----------
function readFile(f) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onprogress = (e) => { if (e.lengthComputable) setStep("read", (e.loaded / e.total) * 100, `${mb(e.loaded)} / ${mb(e.total)}`); };
    r.onload = () => { setStep("read", 100, "File ready ✓"); resolve(r.result); };
    r.onerror = () => reject(new Error("READ"));
    r.readAsArrayBuffer(f);
  });
}

// ---------- 2. audio: decode, mix to mono, resample to 16 kHz ----------
async function prepareAudio(buffer) {
  setStep("audio", 10, "Decoding audio…");
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) throw new Error("NOAUDIO");
  const ctx = new Ctx();
  let decoded;
  try { decoded = await ctx.decodeAudioData(buffer.slice(0)); }
  catch { await ctx.close(); throw new Error("DECODE"); }
  const seconds = decoded.duration;

  setStep("audio", 45, "Mixing to mono…");
  const mono = new Float32Array(decoded.length);
  for (let c = 0; c < decoded.numberOfChannels; c++) {
    const data = decoded.getChannelData(c);
    for (let i = 0; i < decoded.length; i++) mono[i] += data[i] / decoded.numberOfChannels;
  }
  await ctx.close();
  if (decoded.sampleRate === SAMPLE_RATE) { setStep("audio", 100, `Audio ready · ${clock(seconds)} ✓`); return { audio: mono, seconds }; }

  setStep("audio", 70, "Converting to 16 kHz…");
  const off = new OfflineAudioContext(1, Math.ceil((mono.length * SAMPLE_RATE) / decoded.sampleRate), SAMPLE_RATE);
  const buf = off.createBuffer(1, mono.length, decoded.sampleRate);
  buf.copyToChannel(mono, 0);
  const src = off.createBufferSource();
  src.buffer = buf; src.connect(off.destination); src.start(0);
  const audio = (await off.startRendering()).getChannelData(0).slice();
  setStep("audio", 100, `Audio ready · ${clock(seconds)} ✓`);
  return { audio, seconds };
}

// ---------- 3. model: CPU. Cached after the first download. ----------
// Why not WebGPU: this model is stored compressed ("q8"). On WebGPU it must be unpacked at every step,
// which is often SLOWER than the CPU. The CPU path is also what the old ReelScribe effectively used.
async function loadWhisper() {
  if (transcriber) { setStep("model", 100, `AI model ready · ${device} ✓`); return; }
  setStep("model", 1, "Checking saved model…");
  device = "CPU";
  transcriber = await makePipeline("wasm");
}
async function makePipeline(dev) {
  let last = 0;
  const pipe = await pipeline("automatic-speech-recognition", MODEL, {
    device: dev, dtype: "q8",
    progress_callback: (d) => {
      if (d.status === "progress") {
        last = Math.max(last, Math.round(Number(d.progress) || 0));
        setStep("model", last, d.loaded && d.total ? `Downloading AI model (first time only) · ${mb(d.loaded)} / ${mb(d.total)}` : "Loading AI model…");
      }
    },
  });
  setStep("model", 100, `AI model ready · ${device} ✓`);
  return pipe;
}

// ---------- 4. transcribe in parts (≈30 s each) so you see real progress and text as it comes ----------
// Whisper hears 30 s at a time anyway. We cut at the quietest moment near each 30 s mark, so words are not cut in half.
const PART_S = 30, SEARCH_S = 4;
export function splitAtSilence(audio, rate = SAMPLE_RATE, partS = PART_S, searchS = SEARCH_S) {
  const parts = [], frame = Math.round(rate * 0.02); // 20 ms frames
  let start = 0;
  while (audio.length - start > partS * rate) {
    const from = start + (partS - searchS) * rate, to = start + partS * rate;
    let best = to, bestE = Infinity;
    for (let f = from; f + frame <= to; f += frame) {
      let e = 0;
      for (let i = f; i < f + frame; i++) e += audio[i] * audio[i];
      if (e < bestE) { bestE = e; best = f + (frame >> 1); }
    }
    parts.push(audio.subarray(start, best));
    start = best;
  }
  if (audio.length - start > rate * 0.3) parts.push(audio.subarray(start)); // skip a tiny silent tail
  return parts;
}
const tick = () => new Promise((r) => setTimeout(r, 0)); // let the screen update between parts

// ---------- Repeat-glitch guard ----------
// Small Whisper models sometimes get stuck repeating one phrase ("you're gonna watch this, you're gonna watch this, …").
// Phones and computers do the maths slightly differently, so it can happen on one and not the other.
// Rule: the same phrase (2–10 words) 3+ times in a row → keep one. A single word needs 5+ ("no no no" stays).
export function removeLoops(text) {
  let t = String(text), total = 0;
  for (let pass = 0; pass < 5; pass++) {
    const words = t.split(/\s+/).filter(Boolean), out = [];
    const norm = (w) => w.toLowerCase().replace(/[^\p{L}\p{N}']/gu, "");
    let found = 0;
    for (let i = 0; i < words.length; ) {
      let skip = false;
      for (let n = 1; n <= 10; n++) { // shortest repeating phrase first
        if (i + n * 3 > words.length) break;
        const key = words.slice(i, i + n).map(norm).join(" ");
        if (!key.replace(/ /g, "")) continue;
        let k = 1;
        while (i + (k + 1) * n <= words.length && words.slice(i + k * n, i + (k + 1) * n).map(norm).join(" ") === key) k++;
        if (k >= (n === 1 ? 5 : 3)) { out.push(...words.slice(i, i + n)); i += k * n; found++; skip = true; break; }
      }
      if (!skip) out.push(words[i++]);
    }
    if (!found) break;
    t = out.join(" "); total += found;
  }
  return { text: t.trim(), loops: total };
}
async function transcribePart(part) {
  const first = (await transcriber(part, { task: "transcribe" }))?.text?.trim() || "";
  const r = removeLoops(first);
  if (!r.loops) return { text: first, fixed: false };
  // Loop found: try this part once more, discouraging repeats; keep whichever is clean
  try {
    const again = (await transcriber(part, { task: "transcribe", repetition_penalty: 1.2 }))?.text?.trim() || "";
    if (again && !removeLoops(again).loops) return { text: again, fixed: true };
  } catch (e) { console.warn("retry failed", e); }
  return { text: r.text, fixed: true };
}

async function transcribe(audio, seconds) {
  const parts = splitAtSilence(audio);
  const t0 = performance.now();
  let text = "", fixed = 0;
  $("result").value = "";
  $("resultMeta").textContent = "";
  $("resultCard").classList.remove("hidden");
  for (let i = 0; i < parts.length; i++) {
    const done = performance.now() - t0, left = i ? (done / i) * (parts.length - i) / 1000 : null;
    setStep("text", (i / parts.length) * 100,
      `Part ${i + 1} of ${parts.length}` + (left != null ? ` · about ${clock(left)} left` : ` · ${clock(seconds)} of audio`));
    await tick();
    const { text: piece, fixed: wasFixed } = await transcribePart(parts[i]);
    if (wasFixed) fixed++;
    if (piece) {
      text += (text ? " " : "") + piece;
      $("result").value = text; // text appears as each part finishes
      $("resultMeta").textContent = `${text.split(/\s+/).length} words`;
    }
  }
  if (!text) { $("resultCard").classList.add("hidden"); throw new Error("NOSPEECH"); }
  setStep("text", 100, `Done in ${clock((performance.now() - t0) / 1000)} · ${parts.length} part${parts.length > 1 ? "s" : ""} · ${device} ✓`
    + (fixed ? ` · fixed a repeat glitch` : ""));
}

// ---------- copy ----------
$("copyBtn").addEventListener("click", async () => {
  const text = $("result").value.trim();
  if (!text) return;
  try { await navigator.clipboard.writeText(text); } catch { $("result").select(); document.execCommand("copy"); }
  $("copyBtn").textContent = "Copied ✓";
  setTimeout(() => ($("copyBtn").textContent = "Copy text"), 1800);
});

// ---------- ✨ Clean up (optional): fixes wrong words + punctuation with your MyBrain Groq key ----------
// The key is the one saved in MyBrain ⚙️ Settings (same website, same browser storage). Only the TEXT is sent to Groq.
const GROQ_MODELS = ["openai/gpt-oss-120b", "openai/gpt-oss-20b"];
const CLEAN_PROMPT = `You fix speech-to-text transcripts of short videos (reels) and voice notes.
Fix misheard words, spelling, punctuation and capital letters. Split into short paragraphs where the topic changes.
Keep the SAME language and script as the input (English stays English, Hindi stays Hindi, Hinglish stays Hinglish). Do NOT translate.
Do NOT summarize, shorten, add ideas or add comments. Keep the speaker's meaning and words.
PLAIN TEXT ONLY: no Markdown, no asterisks (*), no bold or italics, no headings (#), no bullet points, no titles.
Reply with the corrected transcript only.`;
let beforeClean = null;

// Safety net: remove Markdown the AI may still add (MyBrain shows plain text, so ** would show as stars)
export function plainText(t) {
  return String(t)
    .replace(/\*\*(.+?)\*\*/gs, "$1")          // **bold**
    .replace(/__(.+?)__/gs, "$1")                  // __bold__
    .replace(/(^|[\s(])\*(?!\s)([^*\n]+?)\*(?=[\s.,;:!?)]|$)/gm, "$1$2") // *italic*
    .replace(/(^|[\s(])_(?!\s)([^_\n]+?)_(?=[\s.,;:!?)]|$)/gm, "$1$2")     // _italic_
    .replace(/^#{1,6}\s+/gm, "")                  // # headings
    .replace(/^[ \t]*[*•-][ \t]+/gm, "")         // bullet markers at line start (keep blank lines)
    .replace(/\*{2,}/g, "")                       // stray ** left over
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

async function cleanUp() {
  const key = localStorage.getItem("key_groq") || "";
  if (!key) return msg('Add your Groq key in <a href="/mybrain/#settings">MyBrain ⚙️ Settings</a> first.');
  const text = $("result").value.trim();
  if (!text) return;
  const btn = $("cleanBtn");
  btn.disabled = true; btn.textContent = "Cleaning…"; msg("");
  try {
    let out = "", lastErr = "";
    for (const model of GROQ_MODELS) {
      try { out = await askGroq(key, model, text); if (out) break; }
      catch (e) { lastErr = e.message; }
    }
    if (!out) throw new Error(lastErr || "empty reply");
    out = plainText(out);
    // Safety check: a clean-up should not drop or invent large parts
    const ratio = out.split(/\s+/).length / text.split(/\s+/).length;
    if (ratio < 0.6 || ratio > 1.6) throw new Error("the AI changed too much of the text");
    beforeClean = text;
    $("result").value = out;
    $("resultMeta").textContent = `${out.split(/\s+/).length} words · cleaned`;
    msg('Cleaned ✓ <button id="undoClean">Undo</button>');
    $("undoClean").onclick = () => { $("result").value = beforeClean; beforeClean = null; msg("Back to the original text."); };
  } catch (e) {
    msg("Couldn't clean up: " + esc(e.message) + ". Your text is unchanged.");
  }
  btn.disabled = false; btn.textContent = "✨ Clean up";
}
async function askGroq(key, model, text) {
  const body = { model, temperature: 0.2, max_tokens: Math.min(8000, Math.round(text.length / 2) + 500),
    messages: [{ role: "system", content: CLEAN_PROMPT }, { role: "user", content: text }],
    ...(/gpt-oss/.test(model) ? { reasoning_effort: "low" } : {}) };
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + key }, body: JSON.stringify(body) });
  if (res.status === 401) throw new Error("the Groq key was rejected — check it in MyBrain Settings");
  if (res.status === 429) throw new Error("Groq is busy (free limit) — try again in a minute");
  if (!res.ok) throw new Error("Groq error " + res.status);
  const json = await res.json();
  return (json.choices?.[0]?.message?.content || "").trim();
}
$("cleanBtn").addEventListener("click", cleanUp);

// ---------- Save to MyBrain: one tap → a Note in your Inbox, tagged "reel" ----------
// Uses the MyBrain login already in this browser (same website) and MyBrain's own Supabase file.
const MB_URL = "https://yncbwqhytcxkqrlonkkk.supabase.co";
const MB_KEY = "sb_publishable_Sf-aeTSLVtF1aR2-KUSWMA_ecVQidxd";
let mbClient = null;
async function getMB() {
  if (mbClient) return mbClient;
  if (!window.supabase) await new Promise((ok, fail) => { const sc = document.createElement("script"); sc.src = "/mybrain/vendor/supabase.js"; sc.onload = ok; sc.onerror = fail; document.head.appendChild(sc); });
  return (mbClient = window.supabase.createClient(MB_URL, MB_KEY));
}
async function saveToMyBrain() {
  const text = $("result").value.trim();
  if (!text) return;
  const btn = $("saveBtn");
  btn.disabled = true; btn.textContent = "Saving…"; msg("");
  try {
    const db = await getMB();
    const { data: { session } } = await db.auth.getSession();
    if (!session) { msg('<a href="/mybrain/">Log in to MyBrain</a> first, then come back and tap Save.'); btn.disabled = false; btn.textContent = "Save to MyBrain"; return; }
    const words = text.replace(/\s+/g, " ").split(" ");
    const title = words.slice(0, 8).join(" ").replace(/[.,;:!?]+$/, "") + (words.length > 8 ? "…" : "");
    const row = { kind: "note", title: title.slice(0, 200), body: text + (file ? `\n\n— from ${file.name}` : ""), tags: ["reel"], due: null, priority: 2 };
    // Put it in the Inbox list (if MyBrain lists exist)
    const { data: lists } = await db.from("lists").select("id, name");
    const inbox = (lists || []).find((l) => /^inbox$/i.test(l.name));
    if (inbox) row.list_id = inbox.id;
    const { data, error } = await db.from("items").insert(row).select("id").single();
    if (error) throw error;
    btn.textContent = "Saved ✓";
    msg(`Saved to MyBrain Notes · <a href="/mybrain/#note/${encodeURIComponent(data.id)}">Open it ›</a>`);
    setTimeout(() => { btn.disabled = false; btn.textContent = "Save again"; }, 2500);
  } catch (e) {
    console.error(e);
    msg("Couldn't save: " + esc(e.message || String(e)) + ". Copy the text so you don't lose it.");
    btn.disabled = false; btn.textContent = "Save to MyBrain";
  }
}
$("saveBtn").addEventListener("click", saveToMyBrain);

// ---------- helpers ----------
function msg(html) { $("actMsg").innerHTML = html; }
function esc(t) { const d = document.createElement("div"); d.textContent = String(t); return d.innerHTML; }
function setStep(name, pct, detail) {
  pct = Math.max(0, Math.min(100, Number(pct) || 0));
  $(name + "Pc").textContent = Math.round(pct) + "%";
  $(name + "Bar").style.width = pct + "%";
  $(name + "Detail").textContent = detail;
}
function resetProgress() {
  setStep("read", 0, "Waiting…");
  setStep("audio", 0, "Waiting…");
  transcriber ? setStep("model", 100, `AI model already loaded · ${device}`) : setStep("model", 0, "Waiting…");
  setStep("text", 0, "Waiting…"); $("textPc").textContent = "—";
  $("result").value = "";
  $("resultCard").classList.add("hidden");
  msg(""); beforeClean = null;
  $("saveBtn").disabled = false; $("saveBtn").textContent = "Save to MyBrain";
}
function showError(msg) { $("errorBox").textContent = msg; $("errorBox").classList.toggle("hidden", !msg); }
// Plain-English errors with a next step
function friendly(e) {
  const m = e?.message || "";
  if (m === "READ") return "Couldn't read this file. Choose it again, or save it to the phone first.";
  if (m === "NOAUDIO") return "This browser can't process audio. Open ReelScribe in Chrome.";
  if (m === "DECODE") return "Couldn't read the sound in this file. Try an MP4 or M4A version (iPhone MOV videos sometimes fail on Android).";
  if (m === "NOSPEECH") return "No speech found. The video may have only music or no sound.";
  if (/fetch|network|Failed to load/i.test(m)) return "Couldn't download the AI model. Check the internet and try again (needed only the first time).";
  if (/memory|allocation/i.test(m)) return "The phone ran out of memory. Close other apps, or try a shorter file.";
  return "Something went wrong: " + m;
}
const mb = (b) => (b / 1024 / 1024).toFixed(1) + " MB";
const clock = (s) => { s = Math.max(0, Math.round(s)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
</script>
